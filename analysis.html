<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据分析 - Kykky 阅读数据统计</title>
    <link rel="stylesheet" href="/assets/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<div id="site-nav"></div>

<main class="container py-4" style="max-width: 960px;">
    <div id="loading-view" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"><span class="visually-hidden">加载中...</span></div>
        <p class="mt-3 text-muted">正在加载阅读数据...</p>
    </div>

    <div id="no-data-view" class="text-center py-5" hidden>
        <div class="mb-3"><i class="fa-solid fa-inbox fa-4x text-muted"></i></div>
        <h4 class="text-muted">暂无阅读数据</h4>
        <p class="text-secondary">请先上传 Kindle 日志文件以生成分析报告</p>
        <a href="/upload.html" class="btn btn-primary mt-2">
            <i class="fa-solid fa-cloud-arrow-up me-1"></i> 前往上传
        </a>
    </div>

    <div id="dashboard-view" hidden>
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2" id="month-nav">
            <div class="btn-group">
                <button class="btn btn-outline-primary btn-sm" id="month-prev" type="button">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <span class="btn btn-outline-primary btn-sm disabled fw-bold" id="current-date-display"
                      style="min-width: 120px; opacity: 1; color: var(--bs-primary, #0d6efd);">加载中...</span>
                <button class="btn btn-outline-primary btn-sm" id="month-next" type="button">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
            <div>
                <a href="/upload.html" class="btn btn-outline-primary btn-sm">
                    <i class="fa-solid fa-cloud-arrow-up me-1"></i> 更新数据
                </a>
            </div>
        </div>

        <div id="capture-area">
            <div class="d-flex justify-content-between align-items-end mb-4 px-1">
                <div>
                    <h4 class="fw-bold mb-1 text-dark"><span id="report-nickname">我</span> 的阅读分析报告</h4>
                    <span class="badge bg-primary-subtle text-primary mt-1 px-3 py-2 rounded-pill" id="report-badge">
                        <i class="fa-regular fa-calendar-check me-1"></i> -- 年 -- 月
                    </span>
                </div>
                <div class="text-end d-none d-md-block">
                    <small class="text-muted">Data Source: Server Import</small>
                </div>
            </div>

            <div class="analysis-panel">
                <div class="row text-center g-3">
                    <div class="col-6 col-md-3">
                        <div class="highlight-num text-primary" id="val-last-day">0</div>
                        <div class="sub-label">最后阅读日(分钟)</div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="highlight-num" id="val-month">0</div>
                        <div class="sub-label">本月累计(分钟)</div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="highlight-num text-success" id="val-goal">0</div>
                        <div class="sub-label">达标天数</div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="highlight-num text-warning" id="val-streak">0</div>
                        <div class="sub-label">最长连续(天)</div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div id="sec-today" class="analysis-panel">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="fw-bold m-0">
                                <i class="fa-solid fa-chart-simple text-primary me-2"></i>时段分布 (最后活跃日)
                            </h6>
                            <button class="btn btn-sm btn-light text-muted" data-export="sec-today" data-name="时段分布" type="button">
                                <i class="fa-solid fa-camera"></i>
                            </button>
                        </div>
                        <div class="chart-container"><canvas id="todayChart"></canvas></div>
                        <p class="small text-muted mt-3 mb-0 bg-light p-2 rounded" id="comment-today">
                            <i class="fa-solid fa-lightbulb text-warning me-1"></i> 加载中...
                        </p>
                    </div>
                </div>
                <div class="col-md-6">
                    <div id="sec-week" class="analysis-panel">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="fw-bold m-0">
                                <i class="fa-solid fa-chart-line text-primary me-2"></i>近期每日趋势
                            </h6>
                            <button class="btn btn-sm btn-light text-muted" data-export="sec-week" data-name="每日趋势" type="button">
                                <i class="fa-solid fa-camera"></i>
                            </button>
                        </div>
                        <div class="chart-container"><canvas id="weekChart"></canvas></div>
                        <p class="small text-muted mt-3 mb-0 bg-light p-2 rounded" id="comment-week">
                            <i class="fa-solid fa-chart-line text-primary me-1"></i> 加载中...
                        </p>
                    </div>
                </div>
            </div>

            <div id="sec-month" class="analysis-panel">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h6 class="fw-bold m-0"><i class="fa-solid fa-calendar-days text-primary me-2"></i>全月阅读日历</h6>
                    <button class="btn btn-sm btn-light text-muted" data-export="sec-month" data-name="月日历" type="button">
                        <i class="fa-solid fa-camera"></i>
                    </button>
                </div>
                <div class="calendar-scroll-area">
                    <div class="calendar-grid-container">
                        <div class="calendar-grid mb-2">
                            <div class="calendar-day-header">日</div>
                            <div class="calendar-day-header">一</div>
                            <div class="calendar-day-header">二</div>
                            <div class="calendar-day-header">三</div>
                            <div class="calendar-day-header">四</div>
                            <div class="calendar-day-header">五</div>
                            <div class="calendar-day-header">六</div>
                        </div>
                        <div class="calendar-grid" id="calendar-body"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="fab-container">
            <button class="btn btn-primary btn-fab shadow" id="export-full" type="button">
                <i class="fa-solid fa-download me-2"></i> 保存长图报告
            </button>
        </div>
    </div>
</main>

<footer class="text-center py-4 text-secondary small">
    &copy; <span id="year"></span> Kykky Project. TQHYG.
</footer>

<script src="/assets/vendor/pako/pako.min.js"></script>
<script src="/assets/vendor/chartjs/chart.umd.min.js"></script>
<script src="/assets/vendor/html2canvas/html2canvas.min.js"></script>
<script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/analysis.js"></script>
</body>
</html>
