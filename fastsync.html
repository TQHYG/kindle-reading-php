<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快捷同步 - Kykky 阅读数据统计</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<div id="site-nav"></div>

<main class="container py-4" style="max-width: 520px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <div id="sync-loading" class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-3 text-secondary mb-0">正在校验同步数据...</p>
            </div>

            <div id="sync-error" hidden></div>

            <div id="sync-preview" hidden>
                <h3 class="text-center mb-3"><i class="fa-solid fa-qrcode me-1"></i> 快捷同步</h3>
                <p class="text-secondary text-center">检测到来自您的 Kindle 的阅读数据：</p>
                <div class="data-preview">
                    <div class="data-row">
                        <span class="data-label">今日阅读</span>
                        <span class="data-value" id="sync-today">-</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">本月阅读</span>
                        <span class="data-value" id="sync-month">-</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">设备</span>
                        <span class="data-value text-secondary fw-normal" id="sync-device">-</span>
                    </div>
                </div>
                <button class="btn btn-primary w-100 py-3" id="sync-confirm" type="button">
                    <i class="fa-solid fa-check-double me-1"></i> 确认覆盖并同步
                </button>
                <p class="text-center mt-3 small text-secondary mb-0">确认后将覆盖您当前的排行榜数据</p>
            </div>

            <div id="sync-success" class="text-center py-4" hidden>
                <div class="text-success mb-3" style="font-size: 48px;">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <h2 class="mb-2">同步成功</h2>
                <p class="text-secondary mb-4" id="sync-success-text"></p>
                <a href="/user.html" class="btn btn-primary">前往用户中心</a>
            </div>
        </div>
    </div>
</main>

<footer class="text-center py-4 text-secondary small">
    &copy; <span id="year"></span> Kykky Project. TQHYG.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/fastsync.js"></script>
</body>
</html>
