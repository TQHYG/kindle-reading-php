<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导入数据 - Kykky 阅读数据统计</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<div id="site-nav"></div>

<main class="container py-4" style="max-width: 700px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="mb-3"><i class="fa-solid fa-cloud-arrow-up me-1"></i> 手动同步阅读日志</h3>
            <div class="alert alert-warning">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <strong>注意：</strong>上传将以本次数据为准更新排行榜，并覆盖服务器上的旧日志备份。
            </div>

            <div id="upload-result" hidden></div>

            <div id="drop-zone" class="upload-zone">
                <input type="file" id="file-input" webkitdirectory directory multiple hidden>
                <div class="icon-box"><i class="fa-solid fa-folder-tree"></i></div>
                <h4>拖拽 log 文件夹或点击选择</h4>
                <p class="text-secondary mb-0">请选择包含 <code>history.gz</code> 的 Kindle 日志目录</p>
                <div id="file-list" class="mt-2 text-success fw-bold"></div>
            </div>

            <div class="form-text mt-2">
                今日/本月时长由服务端重新解析日志计算，避免客户端数据不一致。
            </div>

            <button id="upload-btn" class="btn btn-primary w-100 mt-3 py-2" disabled>
                开始同步
            </button>
        </div>
    </div>
</main>

<footer class="text-center py-4 text-secondary small">
    &copy; <span id="year"></span> Kykky Project. TQHYG.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/upload.js"></script>
</body>
</html>
