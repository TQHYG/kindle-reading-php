<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备绑定 - Kykky 阅读数据统计</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<div id="site-nav"></div>

<main class="container py-4" style="max-width: 520px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <div id="device-loading" class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-3 text-secondary mb-0">正在读取设备信息...</p>
            </div>

            <div id="device-error" hidden></div>

            <div id="device-form-wrap" hidden>
                <h3 class="mb-2"><i class="fa-solid fa-link me-1"></i> 绑定 Kindle 设备</h3>
                <p class="text-secondary small">请为这台设备起一个名字，绑定后回到 Kindle 即可继续同步。</p>
                <div class="mb-3">
                    <label class="form-label">设备识别码</label>
                    <input class="form-control" id="device-code" readonly>
                </div>
                <form id="device-form">
                    <div class="mb-3">
                        <label class="form-label" for="device-name">设备名称</label>
                        <input class="form-control" id="device-name" name="device_name" maxlength="50"
                               placeholder="例如：我的 KPW5 / 卧室的 Kindle" required>
                    </div>
                    <button class="btn btn-primary w-100 py-2" id="bind-button" type="submit">
                        确认绑定
                    </button>
                </form>
            </div>

            <div id="device-success" class="text-center py-4" hidden>
                <div class="text-success mb-3" style="font-size: 48px;">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <h2 class="mb-2">绑定成功！</h2>
                <p class="text-secondary mb-4" id="device-success-text"></p>
                <div class="d-flex gap-2 justify-content-center flex-wrap">
                    <a href="/user.html" class="btn btn-primary">前往用户中心</a>
                    <a href="/rank.html" class="btn btn-outline-primary">查看排行榜</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="text-center py-4 text-secondary small">
    &copy; <span id="year"></span> Kykky Project. TQHYG.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/device.js"></script>
</body>
</html>
