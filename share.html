<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阅读报告 - Kykky</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="share-page">
<div class="container py-4" id="export-container">
    <div id="capture-area">
        <div class="d-flex justify-content-between align-items-end mb-4 px-2">
            <div>
                <h3 class="fw-bold mb-0 text-dark">
                    <span id="nickname-display" class="nickname-trigger" title="点击修改昵称">我</span>
                    的阅读分析报告
                </h3>
                <span class="badge bg-primary-subtle text-primary mt-2 px-3 py-2 rounded-pill" id="share-badge">
                    <i class="fa-regular fa-calendar-check me-1"></i> -- 年 -- 月
                </span>
            </div>
            <div class="text-end d-none d-md-block">
                <small class="text-muted">Generated by Kindle Plugin</small>
            </div>
        </div>

        <div id="sec-overview" class="stat-card">
            <div class="row text-center g-3">
                <div class="col-6 col-md-3">
                    <div class="highlight-num text-primary" id="share-today">0</div>
                    <div class="sub-label">今日时长(m)</div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="highlight-num" id="share-month">0</div>
                    <div class="sub-label">本月累计(m)</div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="highlight-num text-success" id="share-goal-days">0</div>
                    <div class="sub-label">达标天数</div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="highlight-num text-warning" id="share-streak">0</div>
                    <div class="sub-label">连续达标(天)</div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div id="sec-today" class="stat-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="fw-bold m-0"><i class="fa-solid fa-chart-simple text-primary me-2"></i>今日时段分布</h6>
                        <button class="btn btn-sm btn-outline-light text-muted border-0" data-export="sec-today" data-name="今日分布" type="button">
                            <i class="fa-solid fa-camera"></i>
                        </button>
                    </div>
                    <div class="chart-container"><canvas id="todayChart"></canvas></div>
                    <p class="small text-muted mt-3 mb-0 bg-light p-2 rounded" id="comment-today">
                        <i class="fa-solid fa-quote-left me-1 opacity-50"></i> 暂无数据。
                    </p>
                </div>
            </div>
            <div class="col-md-6">
                <div id="sec-week" class="stat-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="fw-bold m-0"><i class="fa-solid fa-chart-line text-primary me-2"></i>近七天趋势</h6>
                        <button class="btn btn-sm btn-outline-light text-muted border-0" data-export="sec-week" data-name="周趋势" type="button">
                            <i class="fa-solid fa-camera"></i>
                        </button>
                    </div>
                    <div class="chart-container"><canvas id="weekChart"></canvas></div>
                    <p class="small text-muted mt-3 mb-0 bg-light p-2 rounded" id="comment-week">
                        <i class="fa-solid fa-quote-left me-1 opacity-50"></i> 暂无数据。
                    </p>
                </div>
            </div>
        </div>

        <div id="sec-month" class="stat-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h6 class="fw-bold m-0"><i class="fa-solid fa-calendar-days text-primary me-2"></i>全月阅读日历</h6>
                <button class="btn btn-sm btn-outline-light text-muted border-0" data-export="sec-month" data-name="月日历" type="button">
                    <i class="fa-solid fa-camera"></i>
                </button>
            </div>
            <div class="calendar-scroll-area">
                <div class="calendar-grid-container">
                    <div class="calendar-grid mb-2">
                        <div class="calendar-day-header">SUN</div>
                        <div class="calendar-day-header">MON</div>
                        <div class="calendar-day-header">TUE</div>
                        <div class="calendar-day-header">WED</div>
                        <div class="calendar-day-header">THU</div>
                        <div class="calendar-day-header">FRI</div>
                        <div class="calendar-day-header">SAT</div>
                    </div>
                    <div class="calendar-grid" id="share-calendar"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="fab-container">
    <button class="btn btn-primary btn-fab shadow" id="share-export" type="button">
        <i class="fa-solid fa-download me-2"></i> 保存完整报告
    </button>
</div>

<div id="nickname-modal" class="custom-modal">
    <div class="modal-content-box">
        <h4 class="fw-bold mb-3">设置你的昵称</h4>
        <p class="text-muted small mb-4">昵称将显示在统计报告的标题中</p>
        <input type="text" id="nickname-input" class="form-control mb-4 text-center" placeholder="例如: 书虫小王" maxlength="10">
        <div class="d-flex gap-2 justify-content-center">
            <button class="btn btn-primary px-4" id="nickname-save" type="button">保存</button>
            <button class="btn btn-outline-secondary px-4" id="nickname-cancel" type="button">取消</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/share.js"></script>
</body>
</html>
