<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户中心 - Kykky 阅读数据统计</title>
    <link rel="stylesheet" href="/assets/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<div id="site-nav"></div>

<main class="container py-4">
    <div id="page-alert" hidden></div>

    <div class="card shadow-sm mb-4">
        <div class="card-body d-flex flex-wrap align-items-center gap-3">
            <div id="profile-avatar"></div>
            <div class="flex-grow-1">
                <h4 class="mb-0" id="profile-name">加载中...</h4>
                <p class="mb-0 text-secondary"><i class="fa-regular fa-id-card me-1"></i> 阅读数据概览</p>
            </div>
            <div class="d-flex gap-2">
                <a href="/upload.html" class="btn btn-outline-primary btn-sm">
                    <i class="fa-solid fa-cloud-arrow-up me-1"></i> 更新日志
                </a>
                <a href="/analysis.html" class="btn btn-outline-primary btn-sm">
                    <i class="fa-solid fa-chart-pie me-1"></i> 数据分析
                </a>
            </div>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card shadow-sm text-center h-100">
                <div class="card-body">
                    <div class="stat-label mb-1">今日阅读</div>
                    <div class="stat-value" id="stat-today">-</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card shadow-sm text-center h-100">
                <div class="card-body">
                    <div class="stat-label mb-1">本周阅读</div>
                    <div class="stat-value" id="stat-week">-</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card shadow-sm text-center h-100">
                <div class="card-body">
                    <div class="stat-label mb-1">本月累计</div>
                    <div class="stat-value" id="stat-month">-</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card shadow-sm text-center h-100">
                <div class="card-body">
                    <div class="stat-label mb-1">总计阅读</div>
                    <div class="stat-value" id="stat-total">-</div>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="card-title"><i class="fa-solid fa-box-archive me-1"></i> 数据备份</h5>
            <p class="text-secondary small mb-3">下载服务器上保存的原始日志文件（history.gz 与 metrics 日志）。</p>
            <a href="/api/files.php?action=download_backup" class="btn btn-primary">
                <i class="fa-solid fa-download me-1"></i> 打包下载备份 (.zip)
            </a>
        </div>
    </div>

    <div class="d-flex align-items-center justify-content-between mb-3">
        <h5 class="mb-0"><i class="fa-solid fa-tablet-screen-button me-1"></i> 已关联设备</h5>
        <span class="text-secondary small" id="device-count"></span>
    </div>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>设备识别码</th>
                    <th>设备名称</th>
                    <th>有效期至</th>
                    <th class="text-end">操作</th>
                </tr>
                </thead>
                <tbody id="device-table">
                <tr><td colspan="4" class="text-center text-secondary py-5">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer class="text-center py-4 text-secondary small">
    &copy; <span id="year"></span> Kykky Project. TQHYG.
</footer>

<script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/user.js"></script>
</body>
</html>
